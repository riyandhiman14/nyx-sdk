[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nyx-browser"
version = "0.1.0"
description = "Stealth HTTP client for Python — browser-grade TLS and headers, powered by Aegis."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [{name = "Riyan Dhiman"}]
keywords = ["browser", "automation", "scraping", "anti-bot", "stealth"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
    "Topic :: Software Development :: Testing",
    "Programming Language :: Python :: 3",
]
dependencies = ["aiohttp>=3.9.0", "browserforge>=0.1.0"]

[project.scripts]
nyx = "nyx._cli:main"

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]
